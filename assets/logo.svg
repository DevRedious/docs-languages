<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bg-grad)" stroke="#334155" stroke-width="6" />

  <!-- Subtle ambient glow -->
  <circle cx="256" cy="240" r="140" fill="url(#glow-grad)" opacity="0.15" filter="url(#glow)"/>

  <!-- Document / Book Base -->
  <g transform="translate(256, 240) scale(1.15)">
    <!-- Book Spine & Pages -->
    <path d="M-100,-70 C-50,-85 -10,-70 0,-55 C10,-70 50,-85 100,-70 L100,75 C50,60 10,75 0,90 C-10,75 -50,60 -100,75 Z" 
          fill="#1E293B" stroke="#475569" stroke-width="5" stroke-linejoin="round"/>
    
    <!-- Spine divider -->
    <line x1="0" y1="-55" x2="0" y2="90" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>

    <!-- Left Page Code Bracket < -->
    <path d="M-35,-25 L-65,0 L-35,25" 
          fill="none" stroke="url(#accent-grad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

    <!-- Right Page Code Bracket > -->
    <path d="M35,-25 L65,0 L35,25" 
          fill="none" stroke="url(#accent-grad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

    <!-- Center Slash / -->
    <line x1="12" y1="-30" x2="-12" y2="30" 
          stroke="#F8FAFC" stroke-width="8" stroke-linecap="round"/>

    <!-- Left page horizontal lines -->
    <line x1="-80" y1="-45" x2="-30" y2="-45" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
    <line x1="-80" y1="45" x2="-40" y2="45" stroke="#475569" stroke-width="4" stroke-linecap="round"/>

    <!-- Right page horizontal lines -->
    <line x1="30" y1="-45" x2="80" y2="-45" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
    <line x1="40" y1="45" x2="80" y2="45" stroke="#475569" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Bottom Accent Dot / Badge -->
  <circle cx="256" cy="415" r="8" fill="url(#accent-grad)" filter="url(#glow)" />
</svg>
